function v31b64(s){const r=atob(s),b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return b}
document.getElementById('unlockForm').addEventListener('submit',async function(e){e.preventDefault();const btn=document.getElementById('unlockBtn'),pass=document.getElementById('secret').value,err=document.getElementById('error');btn.disabled=true;err.textContent='Membuka...';try{const keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:v31b64(SALT),iterations:350000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);const packed=v31b64(CIPHER),iv=packed.slice(0,12),ct=packed.slice(12);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);document.getElementById('secret').value='';document.open();document.write(new TextDecoder().decode(plain));document.close();}catch(_){err.textContent='Kata sandi tidak cocok atau file rusak.';btn.disabled=false;}});</script></body></html>
