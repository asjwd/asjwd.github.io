<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#f7f9fa"><meta name="description" content="Portal akademik untuk pencarian akses mahasiswa dan pengumuman nilai.">
<title>My Academic Portal</title>
<link rel="icon" type="image/png" href="../asj-square.png?v=13"><link rel="icon" href="../favicon.ico?v=13">
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../v7.css"><link rel="stylesheet" href="../v9.css"><link rel="stylesheet" href="../v10.css?v=13"><link rel="stylesheet" href="../v12.css?v=13"><link rel="stylesheet" href="../v13.css?v=13"><link rel="stylesheet" href="../v14.css?v=14"><link rel="stylesheet" href="../v15.css?v=15"><link rel="stylesheet" href="../v16.css?v=16"><link rel="stylesheet" href="../v17.css?v=17"><link rel="stylesheet" href="../v18.css?v=18"><link rel="stylesheet" href="../v19.css?v=25">
</head><body data-page="academic" class="academic-body">
<header class="academic-topbar v21-ac-topbar"><div class="shell academic-bar">
<a href="/" class="brand brand-dark v12-academic-brand"><img src="../asj-round.png?v=13" class="v12-round-logo" alt="ASJ"><span class="v12-brand-title">My Academic Portal</span></a>
<div class="v21-ac-top-actions"><nav class="v21-ac-nav"><a href="#grades" data-ac-i18n="navGrades">Pengumuman Nilai</a><a href="#academic-tools" data-ac-i18n="navTools">Tools</a></nav><div class="lang-switch" role="group" aria-label="Language / Bahasa"><button type="button" data-ac-lang="id" aria-pressed="true">ID</button><button type="button" data-ac-lang="en" aria-pressed="false">EN</button></div></div>
</div></header>
<main class="shell academic-main v21-ac-main v24-ac-main">
<section class="content-section academic-section v21-ac-search" id="student-search">
<div class="section-heading"><div><span class="section-label" data-ac-i18n="searchLabel">AKSES MAHASISWA</span><h2 data-ac-i18n="searchHeading">Cari akses mahasiswa</h2></div></div>
<div class="v21-ac-search-card"><form id="studentSearchForm" class="v21-ac-search-form" autocomplete="off" role="search">
<input id="studentQuery" type="search" placeholder="Masukkan nama atau NPM" aria-label="Nama atau NPM" maxlength="120" required autocomplete="off" spellcheck="false">
<button type="submit" id="studentSearchButton" data-ac-i18n="searchButton">Cari</button></form>
<div id="studentSearchResponse" class="v21-ac-search-response" role="status" aria-live="polite" hidden></div>
</div>
</section>
<section id="grades" class="content-section academic-section v21-ac-grades v24-ac-grade"><div class="section-heading"><div><span class="section-label" data-ac-i18n="gradesLabel">NILAI</span><h2 data-ac-i18n="gradesHeading">Pengumuman Nilai</h2></div></div>
<div class="grade-picker"><label for="gradeBoardSelect" data-ac-i18n="selectBoard">Pilih pengumuman nilai</label><select id="gradeBoardSelect" class="field"><option value="">Pilih mata kuliah</option></select></div>
<div id="grade-table"></div>
</section>
<section id="academic-tools" class="content-section academic-section"><div class="section-heading"><div><span class="section-label" data-ac-i18n="toolsLabel">PERANGKAT DIGITAL</span><h2 data-ac-i18n="toolsHeading">Tools</h2></div></div><div id="academic-tools-list" class="v24-tool-list"></div></section>
</main>
<footer class="site-footer academic-footer v21-ac-footer"><div class="shell footer-inner"><span>© 2026 as.jawwad</span></div></footer>
<div id="toolRequestModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="toolRequestTitle">
<div class="modal-backdrop" data-tool-close></div><div class="modal-card contact-modal-card"><button class="modal-close" type="button" data-tool-close aria-label="Close">×</button><h2 id="toolRequestTitle">Request Download</h2><p id="toolRequestDescription" class="contact-intro"></p><div id="toolRequestFeedback" class="contact-result" role="status" aria-live="polite" hidden></div>
<form id="toolRequestForm" method="post" target="portfolioContactSubmit"><label for="toolRequesterName">Full Name</label><input id="toolRequesterName" name="fullName" required minlength="2" maxlength="100" autocomplete="name"><label for="toolRequesterRole">Position / Role</label><input id="toolRequesterRole" name="role" required maxlength="100"><label for="toolRequesterOrg">Institution / Organization</label><input id="toolRequesterOrg" name="institution" required maxlength="150"><label for="toolRequesterEmail">Email Address</label><input id="toolRequesterEmail" name="email" type="email" required maxlength="254" autocomplete="email"><input type="hidden" name="action" value="tool_request"><input type="hidden" name="toolId" id="toolRequestId"><input type="hidden" name="requestId" id="toolRequestNonce"><input type="hidden" name="startedAt" id="toolStartedAt"><div class="honeypot" aria-hidden="true"><label>Company<input name="company" autocomplete="off" tabindex="-1"></label></div><button id="toolRequestSubmit" class="btn btn-primary" type="submit">Submit Request</button></form></div></div>
<iframe id="contactSubmissionFrame" name="portfolioContactSubmit" title="Delivery confirmation" tabindex="-1" class="contact-submit-frame" aria-hidden="true"></iframe>
<script src="../common.js?v=16"></script><script src="../academic.js?v=25"></script></body></html>
